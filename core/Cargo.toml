[package]
name = "macsploit-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
rusqlite = { version = "0.37", features = ["bundled"] }
url = "2.5"
ipnet = "2"
email_address = "0.2"
sha2 = "0.10"
time = { version = "0.3", features = ["formatting"] }
hickory-resolver = "0.26"
tokio = { version = "1", features = ["rt", "time", "net", "sync"] }
roxmltree = "0.21"
ureq = "3"
tempfile = "3"
# Managed provider installation: extract exactly one reviewed executable from a
# pinned, checksum-verified upstream archive. Minimal feature sets only.
zip = { version = "8", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"

[dev-dependencies]
tempfile = "3"
# Build fixture archives and compute pinned digests in managed-install tests.
sha2 = "0.10"
zip = { version = "8", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"
