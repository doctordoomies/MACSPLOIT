name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      policy: ${{ steps.paths.outputs.policy }}
      rust: ${{ steps.paths.outputs.rust }}
      swift: ${{ steps.paths.outputs.swift }}
      python: ${{ steps.paths.outputs.python }}
      actions: ${{ steps.paths.outputs.actions }}
      full: ${{ steps.paths.outputs.full }}
      docs: ${{ steps.paths.outputs.docs }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: paths
        run: python3 scripts/classify_ci_changes.py

  policy:
    name: Repository policy
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Policy and routing tests
        run: python3 -m unittest discover -s tests -v
      - name: Full-history repository and identity audits
        run: |
          python3 scripts/check_repository.py --all-history
          python3 scripts/check_identities.py

  rust:
    name: Rust checks (Linux)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compiler identity
        id: compiler
        shell: bash
        run: echo "id=$(rustc -vV | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Restore Cargo cache
        id: cargo-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.compiler.outputs.id }}-${{ hashFiles('Cargo.lock') }}
      - name: Rust format, Clippy, and complete offline suite
        run: |
          rustup component add rustfmt clippy
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace
      # PRs only read caches. Save only successful trusted main builds.
      - name: Save Cargo cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  swift:
    name: Swift checks
    needs: changes
    if: needs.changes.outputs.swift == 'true' && needs.changes.outputs.full != 'true'
    runs-on: macos-15
    timeout-minutes: 25
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compiler identity
        id: compiler
        shell: bash
        run: echo "id=$(rustc -vV | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Restore Cargo cache
        id: cargo-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.compiler.outputs.id }}-${{ hashFiles('Cargo.lock') }}
      - name: Swift tests with offline core bridge
        run: ./scripts/test-swift.sh
      - name: Build and verify signed app
        run: ./scripts/build-macos.sh
      # PRs only read caches. Save only successful trusted main builds.
      - name: Save Cargo cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  full:
    name: Full integration suite (macOS)
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: macos-15
    timeout-minutes: 35
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compiler identity
        id: compiler
        shell: bash
        run: echo "id=$(rustc -vV | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Restore Cargo cache
        id: cargo-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.compiler.outputs.id }}-${{ hashFiles('Cargo.lock') }}
      - name: Rust formatting and Clippy on macOS
        run: |
          rustup component add rustfmt clippy
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Complete offline suite and audits
        run: ./scripts/test.sh
      - name: Build and verify signed app
        run: ./scripts/build-macos.sh
      # PRs only read caches. Save only successful trusted main builds.
      - name: Save Cargo cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  required:
    name: Build & test (macOS)
    if: always()
    needs: [changes, policy, rust, swift, full]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Enforce expected results
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/check_ci_gate.py ci
