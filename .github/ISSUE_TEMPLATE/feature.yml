name: Feature request
description: Suggest an enhancement to MACSPLOIT
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: >-
        Please keep requests focused on authorized security testing. See the
        feature status matrix in docs/features.md before proposing something that
        may already be planned.
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What are you trying to do, and why is it hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: scope
    attributes:
      label: Safety
      options:
        - label: This is for authorized testing and does not center on unauthorized access, credential theft, persistence, or automatic exploitation.
          required: true
